databases:
  - name: peerloop-db-production
    plan: free
    databaseName: peerloop_production
    user: peerloop_production
    ipAllowList: []

services:
  - type: web
    name: peerloop-academy-production
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: peerloop-db-production
          property: connectionString
