<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PEERLOOP Academy</title>
<style>
:root{--bg:#070B14;--txt:#F3F5FF;--mut:#a3aecb;--blue:#5599FF;--vio:#A76BFF;--A:1.7917}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;overflow:hidden}
.view{position:fixed;inset:0;overflow:hidden}
.stage{position:absolute;width:max(100vw,calc(100vh*var(--A)));aspect-ratio:var(--A);right:0;top:50%;transform:translateY(-50%)}
.par{position:absolute;inset:0;will-change:transform}
.par img{position:absolute;inset:0;width:100%;height:100%;display:block}
.fog{position:absolute;left:-20%;width:140%;height:34%;bottom:0;pointer-events:none;opacity:.55;mix-blend-mode:screen;background:radial-gradient(40% 60% at 20% 60%,#8d9bc455,transparent),radial-gradient(35% 55% at 55% 50%,#a7b0d044,transparent),radial-gradient(40% 60% at 85% 60%,#8d9bc455,transparent);animation:drift 40s linear infinite alternate}
.fog.b{bottom:12%;height:28%;opacity:.35;animation-duration:60s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
.glow{position:absolute;border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:screen;pointer-events:none;animation:pulse 3.6s ease-in-out infinite;transition:opacity .3s}
@keyframes pulse{0%,100%{opacity:.35;scale:.92}50%{opacity:.8;scale:1.08}}
.hs{position:absolute;transform:translate(-50%,-50%);width:6%;aspect-ratio:1;border-radius:50%;border:0;background:none;cursor:pointer;padding:0}
.hs.big{width:15%}.hs:focus-visible{outline:2px solid #fff}
.lab{position:absolute;left:50%;top:-4%;transform:translate(-50%,-100%) scale(var(--inv,1));transform-origin:50% 100%;white-space:nowrap;background:#0B1426cc;border:1px solid #ffffff2e;backdrop-filter:blur(8px);padding:5px 11px;border-radius:8px;font-size:.74rem;color:var(--txt);transition:border-color .2s,background .2s}
.copy,.scroll{transition:opacity .4s}body.foc .copy,body.foc .scroll{opacity:0;pointer-events:none}body.foc .copy>*{pointer-events:none}@media(min-width:901px){body.foc .card{left:5vw;right:auto}}
.hs.r .lab{left:100%;top:50%;transform:translate(10px,-50%) scale(var(--inv,1));transform-origin:0 50%}.hs.off{pointer-events:none}.hs.off .lab{opacity:0}
.hs:hover .lab,.hs.on .lab{border-color:var(--c);background:#0B1426f2}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#070B14 0,#070B14d0 22%,#070B1400 58%),linear-gradient(0deg,#070B14aa,transparent 25%),linear-gradient(#070B1488,transparent 18%)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.nav button{background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:0 0 3px;border-bottom:2px solid transparent}.nav button:hover{color:var(--txt)}.nav button.on{color:var(--txt);border-color:var(--blue)}
.pg{position:fixed;inset:0;z-index:8;display:none;overflow:auto;padding:92px 5vw 40px;background:#070B14f4;backdrop-filter:blur(10px)}.pg h2{font-family:Georgia,serif;font-weight:400;font-size:2.4rem;margin:0 0 6px}.pg input{margin-top:16px;width:min(360px,100%);padding:10px 14px;border-radius:10px;border:1px solid #ffffff30;background:#ffffff0d;color:var(--txt);font:inherit}.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:22px}.cc{border:1px solid #ffffff1c;border-top:2px solid var(--c);border-radius:12px;padding:18px;background:#0e1830;transition:transform .25s,box-shadow .25s}.cc:hover{transform:translateY(-4px);box-shadow:0 10px 30px -12px var(--c)}.cc h4{margin:0 0 4px;font-weight:500}.cc small{color:var(--mut)}.cc p{color:var(--mut);line-height:1.5}
.pg textarea,.pg select{width:100%;padding:10px 14px;border-radius:10px;border:1px solid #ffffff30;background:#ffffff0d;color:var(--txt);font:inherit}.pg option{color:#000}.pg h3{font-weight:500;margin:22px 0 0}.pn{border:1px solid #ffffff1c;border-radius:12px;padding:16px;background:#0e1830;margin-top:14px;max-width:760px}.f{display:grid;gap:8px;max-width:520px}.f input{width:100%;margin-top:0}.bar{height:6px;background:#ffffff1a;border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#5599FF,#A76BFF)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.err{color:#ff9a9a;font-size:.8rem;min-height:1em}.toast{position:fixed;left:50%;bottom:30px;translate:-50% 0;z-index:20;background:#0B1426;border:1px solid #7fa8ff;padding:10px 18px;border-radius:10px;font-size:.85rem;display:none}.chk{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:.88rem}.chk input{width:auto;margin:0}.lock{opacity:.45}.pill{font-size:.7rem;border:1px solid #ffffff33;border-radius:99px;padding:2px 9px;color:var(--mut)}@media print{.nav,.toast,.btn,.demo{display:none!important}.pg{position:static;background:#fff;color:#000}.pn,.cc{background:#fff;color:#000}}
.nav{position:fixed;top:0;left:0;right:0;z-index:9;display:flex;gap:22px;align-items:center;padding:16px 5vw;font-size:.84rem;color:var(--mut);overflow-x:auto;white-space:nowrap}
.nav b{color:var(--txt);letter-spacing:.14em;margin-right:14px}.nav .on{color:var(--txt);border-bottom:2px solid var(--blue);padding-bottom:3px}
.copy{position:fixed;z-index:4;left:5vw;top:15vh;max-width:410px;pointer-events:none}.copy>*{pointer-events:auto}
.eye{font-size:.7rem;letter-spacing:.22em;color:#7fa8ff;margin:0}
h1{font-family:Georgia,'Cormorant Garamond',serif;font-weight:400;font-size:clamp(2.2rem,4.4vw,3.8rem);line-height:1.04;margin:.35em 0 .3em;text-shadow:0 2px 24px #000a}
em{font-style:normal;background:linear-gradient(90deg,#7aa0ff,#b48cff);-webkit-background-clip:text;color:transparent}
.mut{color:var(--mut);line-height:1.55;margin:0}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{border:1px solid #ffffff33;background:#ffffff12;color:var(--txt);padding:11px 20px;border-radius:999px;font:inherit;font-size:.88rem;cursor:pointer;backdrop-filter:blur(8px);transition:transform .2s,border-color .2s}
.btn:hover{transform:translateY(-2px);border-color:#7fa8ff}.pri{background:linear-gradient(90deg,#7aa0ff,#9a8cff);color:#0a0f20;border:0;font-weight:600}.sm{padding:6px 13px;font-size:.78rem}
.scroll{position:fixed;left:5vw;bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:4;font-size:.72rem;color:var(--mut);display:flex;gap:10px;align-items:center}.scroll i{width:1px;height:34px;background:linear-gradient(var(--blue),transparent)}
.chips{position:fixed;z-index:4;right:5vw;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
.card{position:fixed;z-index:6;right:5vw;top:50%;translate:0 -50%;width:min(320px,90vw);padding:20px;border:1px solid var(--c,#fff3);border-radius:14px;background:#0B1426e6;backdrop-filter:blur(16px);display:none}
.card h3{margin:0 0 8px;font-weight:500}.demo{position:fixed;z-index:4;top:58px;right:5vw;font-size:.68rem;color:var(--mut)}
@media(max-width:900px){.stage{right:auto;left:50%;transform:translate(-66%,-50%)}.copy{top:13vh}.chips{left:5vw;right:5vw;max-width:none;justify-content:flex-start}.scroll{display:none}.card{top:auto;bottom:90px;translate:0 0}.shade{background:linear-gradient(#070B14dd,#070B1466 45%,transparent),linear-gradient(0deg,#070B14cc,transparent 30%)}.lab{display:none}}
@media(prefers-reduced-motion:reduce){.fog,.glow{animation:none}}
</style></head><body>

 const shade=document.createElement('div');shade.id='pl-auth-shade';shade.innerHTML=`<section id="pl-auth-box" role="dialog" aria-modal="true" aria-labelledby="pl-auth-title"><h2 id="pl-auth-title">Welcome to PEERLOOP</h2><p id="pl-auth-desc">Sign in to sync your learning progress and profile securely across devices.</p><div id="pl-auth-tabs"><button type="button" class="pl-secondary" id="pl-login-tab">Sign in</button><button type="button" class="pl-secondary" id="pl-register-tab">Create account</button></div><form id="pl-auth-form"><div id="pl-name-wrap" hidden><label for="pl-name">Your name</label><input id="pl-name" name="name" autocomplete="name" minlength="2" maxlength="80" /></div><label for="pl-email">Email</label><input id="pl-email" name="email" type="email" autocomplete="email" required maxlength="254" /><label for="pl-password">Password</label><input id="pl-password" name="password" type="password" autocomplete="current-password" required minlength="10" maxlength="72" /><div id="pl-auth-hint">Use your account password.</div><div id="pl-auth-error" role="alert"></div><button class="pl-action" id="pl-auth-submit" type="submit">Sign in</button></form><div id="pl-auth-meta">Your progress is stored in your own account. Guest mode keeps changes only in this browser.</div><div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button type="button" class="pl-secondary" id="pl-guest">Continue as guest</button><button type="button" class="pl-secondary" id="pl-logout" hidden>Sign out</button><button type="button" class="pl-secondary" id="pl-close">Close</button></div></section>`;document.body.appendChild(shade);
 let mode='login';const $=id=>document.getElementById(id);const close=()=>shade.classList.remove('open');const setMode=m=>{mode=m;$('pl-name-wrap').hidden=m!=='register';$('pl-name').required=m==='register';$('pl-password').autocomplete=m==='register'?'new-password':'current-password';$('pl-login-tab').style.borderColor=m==='login'?'#8f7bff':'#354365';$('pl-register-tab').style.borderColor=m==='register'?'#8f7bff':'#354365';$('pl-auth-title').textContent=m==='login'?'Welcome back':'Join PEERLOOP Academy';$('pl-auth-desc').textContent=m==='login'?'Sign in to sync your learning progress and profile securely across devices.':'Create an account to save your learning progress across devices.';$('pl-auth-submit').textContent=m==='login'?'Sign in':'Create account';$('pl-auth-hint').textContent=m==='register'?'Use at least 10 characters with an uppercase letter, lowercase letter, and number.':'Use your account password.';$('pl-auth-error').textContent=''};
 const open=()=>{shade.classList.add('open');$('pl-auth-error').textContent='';if(apiUser){$('pl-auth-title').textContent='Your PEERLOOP account';$('pl-auth-desc').textContent=apiUser.email+' · '+apiUser.role;$('pl-auth-form').hidden=true;$('pl-auth-tabs').hidden=true;$('pl-guest').hidden=true;$('pl-logout').hidden=false;$('pl-auth-meta').textContent='Your account and progress are synced with the server.'}else{setMode(mode);$('pl-auth-form').hidden=false;$('pl-auth-tabs').hidden=false;$('pl-guest').hidden=false;$('pl-logout').hidden=true}};
 function accountStatus(){btn.textContent=apiUser?(apiUser.email.split('@')[0]+' · '+apiUser.role):'Sign in / Create account';$('pl-logout').hidden=!apiUser}window.accountStatus=accountStatus;
 async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||'Request failed');return data}
 async function loadAccount(){try{const me=await api('/api/auth/me');apiUser=me.user;if(apiUser){const state=await api('/api/state');if(state.state&&Object.keys(state.state).length)hydrateState(state.state);else await api('/api/state',{method:'PUT',body:JSON.stringify({state:S})});const p=await api('/api/profile');apiProfile=p.profile;if(apiProfile){S.pf={name:apiProfile.name,bio:apiProfile.bio,skills:apiProfile.skills};try{localStorage.setItem('pl2',JSON.stringify(S))}catch{}}}}catch(e){console.warn('Account bootstrap:',e.message)}accountStatus()}
 btn.addEventListener('click',open);$('pl-login-tab').onclick=()=>setMode('login');$('pl-register-tab').onclick=()=>setMode('register');$('pl-close').onclick=close;$('pl-guest').onclick=close;shade.addEventListener('click',e=>{if(e.target===shade)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
 $('pl-auth-form').addEventListener('submit',async e=>{e.preventDefault();$('pl-auth-submit').disabled=true;$('pl-auth-error').textContent='';try{const body={email:$('pl-email').value.trim(),password:$('pl-password').value};if(mode==='register')body.name=$('pl-name').value.trim();const data=await api('/api/auth/'+(mode==='register'?'register':'login'),{method:'POST',body:JSON.stringify(body)});apiUser=data.user;apiProfile=data.profile;await loadAccount();if(apiProfile){S.pf={name:apiProfile.name,bio:apiProfile.bio,skills:apiProfile.skills};save()}accountStatus();close();toast('Signed in. Your progress is syncing.')}catch(err){$('pl-auth-error').textContent=err.message}finally{$('pl-auth-submit').disabled=false}});
 $('pl-logout').onclick=async()=>{try{await api('/api/auth/logout',{method:'POST'});apiUser=null;apiProfile=null;accountStatus();close();toast('Signed out. Browser-only guest mode is active.')}catch(e){$('pl-auth-error').textContent=e.message}};
 loadAccount();
